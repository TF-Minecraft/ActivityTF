# Referrals: /referral (also a button in /activity).
#
# A new player opens /referral, clicks "Who invited you?" and picks an online
# player or types a name (/referral invitedby <name>), then confirms. That is
# one link per account, and it can never be changed by the player (staff can
# undo it with /referral unlink <player>). Both players then claim rewards from
# the same menu as the NEW player's counted playtime passes each milestone.
#
# /activity reload reloads this file too.

# Off = nobody can link or claim, and no playtime is counted. The kill switch.
enabled: true

season:
  # When the season started, in server time: 2026-10-01 or 2026-10-01T06:10.
  # Playtime only counts from here on. Changing it from one date to another
  # starts a new season: referrals.yml is moved aside
  # (referrals-<old start>-<time>.yml) and every link and counted minute
  # starts again from nothing. Setting it for the first time, or clearing it,
  # keeps what was counted, and a date that does not parse keeps the old one.
  # Empty = no season window, so only accounts in their first
  # link.new-account-days can link.
  start: ""
  # For this many days after season.start, any account can link - and its
  # playtime since the season started already counts towards the rewards.
  open-days: 14

link:
  # After the opening days, only accounts whose first join on this server was
  # less than this many days ago can link.
  new-account-days: 7
  # Refuse a link when the two accounts have joined from the same connection
  # this season (last 16 connections per account, stored as salted hashes).
  # Claims are held for the same reason if they share one later on. Staff
  # can allow one pair that really shares a house with
  # /referral allowip <player> <player> (that pair only, not their alts).
  same-ip-check: true
  # Most players one account can have linked to it this season; 0 = no limit.
  max-invitees: 10
  # Most new links one inviter can receive in 24 hours; 0 = no limit. Stops
  # one account collecting a burst of throwaway accounts in an afternoon.
  max-links-per-day: 3

playtime:
  # A minute counts only when the player has done something in the last
  # afk-minutes: moved at least move-blocks (1 or more), chatted, used a real
  # command, or broken or placed a block. Joining, turning the camera,
  # swinging or clicking alone does not count, so a mouse jiggler, an
  # autoclicker or a reconnect loop earns nothing. Being carried by water or
  # pistons does look like walking.
  afk-minutes: 5
  move-blocks: 3
  # Worlds where nothing counts and nothing can be claimed (rewards go to
  # the character being played, not to the character-selection room).
  ignored-worlds: [character_selection]

# The milestones, the same in every act: the new player's counted playtime
# each one needs. Each is claimed once ever (per season), by the new player
# and once by their inviter; claiming it in one act means it is not paid
# again in the next. Up to 7. Claims are remembered by hours, so don't change
# a milestone's hours during a season: a changed one is new, and everyone who
# claimed the old one could claim it again.
#   hours       the new player's counted playtime it needs
#   rare        true = the inviter's reward counts towards the act's rare-limit
#   new-player  what the invited player gets; inviter: what the inviter gets.
#               Either one is optional. Each is a pool name (one draw), or a
#               block with display (the name in the menu), icon (optional,
#               the menu item) and either 'pool: <name>' or items/commands as
#               in a pool entry (%player% / %uuid% work in commands). A pool
#               is looked up in the act in use first (acts.<act>.pools), then
#               in the shared pools below, then in the activity rewards pools
#               (the ones locked for this activity week) - so what a milestone
#               hands over follows the act.
milestones:
  - hours: 1
    new-player: {display: "Starter kit", icon: BUNDLE, pool: pool_ref_starter}
    inviter: {display: "Coin", icon: m.currency.silver_coin, pool: pool_ref_coin}
  - hours: 4
    new-player: {display: "Act materials (small)", icon: m.materials.ignitium, pool: pool_ref_small}
    inviter: {display: "Act materials (small)", icon: m.materials.ignitium, pool: pool_ref_small}
  - hours: 12
    new-player: {display: "Act materials (medium)", icon: m.materials.ignitium, pool: pool_ref_medium}
    inviter: {display: "Act materials (medium)", icon: m.materials.ignitium, pool: pool_ref_medium}
  - hours: 24
    rare: true
    new-player: {display: "Rare act reward", icon: m.materials.abyssalite_fragment, pool: pool_ref_rare}
    inviter: {display: "Rare act reward", icon: m.materials.abyssalite_fragment, pool: pool_ref_rare}

# Pools every act can use, in the same format as the activity rewards.pools.
# An act's own pool of the same name wins.
pools:
  pool_ref_starter:
    - display: "Starter kit"
      items:
        - item: COOKED_BEEF
          amount: 16
        - item: TORCH
          amount: 32
        - item: OAK_LOG
          amount: 32
  pool_ref_coin:
    - display: "#50d990x5 #b8906eSilver Coin"
      items:
        - item: m.currency.silver_coin
          amount: 5

# The acts. The act in use is the one with the latest 'starts' that is not in
# the future, so the loot changes by itself on the day an act starts.
#   display     the act's name in the menu
#   rare-limit  rare inviter rewards one inviter can claim per act (default
#               2; -1 = no limit). Past it the slot waits for the next act.
#   pools       this act's loot, by the pool names the milestones use
acts:
  act_1:
    display: "Act I"
    starts: "2026-10-10T06:00"
    rare-limit: 2
    pools:
      pool_ref_small:
        - display: "#50d990x10 #7f7d80Ignitium"
          items:
            - item: m.materials.ignitium
              amount: 10
      pool_ref_medium:
        - display: "#50d990x20 #7f7d80Ignitium"
          items:
            - item: m.materials.ignitium
              amount: 20
      pool_ref_rare:
        - weight: 50
          display: "#50d990x1 #3b4e60Abyssalite Fragment"
          items:
            - item: m.materials.abyssalite_fragment
              amount: 1
        - weight: 50
          display: "#50d990x1 #3b4e60Tin"
          items:
            - item: m.materials.raw_tin
              amount: 1
