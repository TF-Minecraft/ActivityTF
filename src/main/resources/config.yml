reset:
  day: MONDAY      # server timezone
  hour: 0          # 0-23

# Seven of these are drawn at random for each player every day and shown in
# /activity; a task earns nothing until the player clicks it to reveal it.
# Every 'every' actions → earn 'points'. 'daily-cap' = how many times per day
# that can happen (0 = no cap), so a day is worth at most daily-cap × points
# (every: 1, points: 5, daily-cap: 1 → the first action gives 5, later ones
# that day give nothing). Bar caps at bar.max; bar.daily-max
# caps what can reach it on any single day, first, and bar.vote-share keeps part
# of that day for voting only. All are bypassed by
# /activity add <player> <activity> <count> --force, which is staff-only and
# credits the full worth of the count; only bar.max still holds it back.
# daily-guaranteed: optional, default false. An activity marked true is in
#   every player's draw every day, at a random slot like any other task; the
#   remaining slots are filled at random as usual. Marking more than seven
#   activities guaranteed is reported at load - the draw would then be seven of
#   them and nothing else could ever be drawn.
# vote: one point per vote site (every: 1, points: 1), daily-cap = how many
#   sites count per day, and always one of the day's tasks.
# playtime: 'every' counts minutes online - see the playtime section at the
#   bottom, and read what afk-minutes does and does not do before relying on it.
# material: the GUI icon, and craft: the item this activity counts crafts of.
#   material: accepts four forms, craft: the first three:
#     IRON_INGOT        a bare vanilla Material name
#     v.iron_ingot      the same thing written as a TLibs item path
#     m.material.steel  an MMOItems item, as m.<type>.<id> - needs TLibs,
#                       MMOItems and MythicLib all installed
#     ia.tfmc:saucepan  an ItemsAdder item, as ia.<namespace:id> - the same id
#                       /iagive takes - and needs ItemsAdder installed.
#                       'ia.tfmc.saucepan' means the same item.
#   An ia. path on craft: is reported at load and never credits anything:
#   matching a crafted item back to an ItemsAdder id is the opposite lookup
#   and is not supported. Use material: (and reward 'item:') for ia. items.
#   Malformed and unsupported-prefix values are reported per entry at load
#   (startup or /activity reload); a missing TLibs/MMOItems/MythicLib is
#   reported once for the whole file, and only if an m. path is configured,
#   and a missing ItemsAdder likewise if an ia. path is.
#   A well-formed m. path that TLibs itself cannot resolve is reported once,
#   the first time it is used (GUI open / craft), and TLibs is not asked
#   about it again until a server restart (/activity reload does not clear
#   this) - later opens keep falling back to the icon's material without
#   logging again.
# craft: optional; a shift-click bulk craft counts every item it made. One
#   item feeds one activity - if two claim the same one, only the first is
#   credited. An unknown name, or a name that is not an item, is logged and
#   that activity is simply never fed. Crafts of a tracked vanilla material
#   never consult TLibs; other crafts check each m. path.
#   The count is worked out at the moment of the click, from the same limits
#   the game itself obeys: a normal click makes exactly one batch, and a
#   shift-click repeats until either the shortest ingredient stack or the room
#   in your inventory (main inventory + hotbar, not armour or offhand) runs
#   out. Nothing is looked at afterwards, so nothing you do later in the tick
#   changes the credit. Clicks that craft nothing - a double-click on the
#   result slot, a number-key or offhand swap onto a slot that is already
#   holding something - count nothing. It still errs low in one place:
#     - a shift-click whose last pass only partly fits counts as a whole batch
#       fewer. Shift-crafting into a full inventory counts nothing, because
#       nothing is made.
#   A shift-click is capped by the shortest ingredient stack, so any recipe
#   with an unstackable ingredient (CAKE needs milk buckets) can only ever make
#   one batch per click, and one click is one craft. A stackable remainder
#   (HONEY_BLOCK hands back glass bottles) does bulk-craft, and is counted like
#   any other bulk craft.
# profession: optional, MMOCore only. Ties the activity to one MMOCore
#   profession id (as named by plugins/MMOCore/professions/<id>.yml; case,
#   underscores and spaces do not matter) and counts XP gained in it - so
#   'every' is XP, not actions. Fractional XP is carried over between gains
#   rather than lost. Two activities naming the same profession is a config
#   error and only the last one is fed. Always set a daily-cap on these:
#   profession XP is unbounded, unlike the one-per-action activities. Here
#   daily-cap counts awards, i.e. at most daily-cap × every XP counts a day.
# station: optional, MMOItems only. Counts crafts made at an MMOItems
#   crafting station, written as either
#     ingot-station        any recipe crafted at that station
#     ingot-station/flint  only recipe 'flint' at that station
#   Station and recipe ids are the ones in plugins/MMOItems/crafting-stations
#   (case and surrounding spaces do not matter). Station and recipe ids are
#   matched case-insensitively and trimmed, but underscores and spaces are
#   NOT folded to dashes - write the id exactly as the station file or recipe
#   section is named. Only crafting recipes are counted; upgrade recipes
#   never feed an activity.
#   One craft feeds exactly one activity: a '<station>/<recipe>' activity
#   wins over one claiming the whole station. Two activities naming the same
#   station/recipe is a config error and only the last one is fed. An activity
#   is counted when the craft actually completes - instantly, or when a queued
#   craft is claimed - so queueing and cancelling count nothing. A recipe with
#   'output-item: false' still counts, and one craft counts as one action
#   however big the output stack is. An
#   activity with both 'station' and 'craft'/'profession' is a config error:
#   the extra 'station' is reported at load and ignored.
# click-commands: optional. Console commands run when the player clicks this
#   activity's task in /activity AFTER it has already been revealed - the
#   first click on a hidden task only reveals it, every later click runs
#   these. They run from the console, not as the player, and %player% and
#   %uuid% are replaced with his name and his UUID. A name that cannot be
#   safely pasted into a console command (a Bedrock name with a space in it,
#   say) skips the commands that use %player% and still runs the %uuid% ones.
#   The menu is closed first and the commands run straight after, on the tick
#   after the click, so a command is free to open a menu of its own and keep
#   it. One player can only set these off once every
#   'click-command-cooldown-millis' however fast he clicks, the server as a
#   whole no more often than 'click-commands-per-second', and one click runs
#   at most 'click-commands-per-click' of them.
# description: optional. A short blurb shown at the top of the task's lore,
#   above the progress bar. Write it as a single string for one line or as a
#   list for several; the same #rrggbb and &-codes 'display' takes work here.
#   It is only shown once the player has revealed the task - a hidden task
#   stays a blank grey dye, so a description never gives away what it is.
#   Anything that is neither a string nor a list is reported at load and the
#   activity simply shows no description.
activities:
  vote:
    display: "#e6ca40&lVoting"
