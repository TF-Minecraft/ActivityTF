# The reward pool. Clicking the weekly bar in /activity claims every
# milestone reached and not yet claimed (see bar.milestones), drawing one
# entry from this pool at random per spin (rewards.multiplier spins per
# milestone), handing over that entry's items and running its commands.
#   weight   - how likely the entry is, relative to the others. Optional,
#              defaults to 1; an entry with weight 0 or less is dropped with a
#              warning and can never be drawn.
#   display  - one line, shown in chat when the entry is drawn.
#   items    - items handed straight to the inventory for that draw, at the
#              amounts written here.
#   commands - console commands run for that draw.
# %player% = name, %uuid% = the player's UUID.
# A command containing %player% is skipped with a warning when the name is not
# [A-Za-z0-9_.]{1,16} (e.g. a Bedrock name with a space); commands that only
# use %uuid% always run. If none of the commands of the drawn entry can run for
# a given player (their name is unsafe and every command pastes %player%),
# nothing is marked claimed and the milestone stays claimable, so fixing the
# commands below still pays it out. The same goes for an empty pool. To reward
# Bedrock/Floodgate or other unsafe names, write reward commands using only
# %uuid% (e.g. via a plugin that can look a player up by UUID).
rewards:
  # How many spins each pool milestone gets: at 2, claiming it draws from the
  # pool twice, independently - the same entry can come up both times - and
  # pays each draw's items and commands at the amounts written, with one chat
  # line per draw. A fixed drop has nothing to spin and hands over its amount
  # times this instead. Read at payout, so a reload changes what the next
  # claim pays. 1-64; anything outside that is clamped, and 0 or a negative
  # reads as 1 rather than as "pay nothing". A total above one stack is
  # handed over as whole stacks of the item's own maximum size.
  multiplier: 1
  # What each milestone pays. N counts the bar.milestones that survive
  # loading - sorted, deduped, out-of-range values dropped - so drop_1 is the
  # lowest of those, drop_2 the next, and so on. Adding or removing a
  # milestone renumbers every drop_N above it. 'pool' spins the pool (once per
  # multiplier) below; anything else is a fixed item, written as a block:
  # 'item:' (required, the same four forms as a pool item) and 'amount:'
  # (optional, 1-64, default 1). The one-line form '<item path> [amount 1-64]'
  # (e.g. "m.material.steel 3") still works too. A fixed item is multiplied,
  # split into stacks, dropped at the feet when it does not fit, and leaves
  # its milestone claimable when it cannot be resolved, exactly like a pool
  # item; chat shows what was handed over, multiplier included ("x3 Steel" at
  # multiplier 1, "x6 Steel" at 2). A missing drop_N, or one that does not
  # parse (it is named in the log), spins the pool.
  drops:
    drop_1: pool
    drop_2: pool
    # drop_3:
    #   item: m.material.steel
    #   amount: 3
  # Named pools may be selected by any drop or daily-reward group:
  # drops:
  #   drop_1: pool_prologue
  #   drop_2: pool_prologue
  #   drop_3: pool_end
  # pools:
  #   pool_prologue:
  #     - weight: 65
  #       display: "#50d990x2 #7f7d80Ignitium"
  #       items:
  #         - item: m.materials.ignitium
  #           amount: 2
  #   pool_end:
  #     - weight: 1
  #       display: "End reward"
  #       items:
  #         - item: NETHERITE_INGOT
  #           amount: 1
  # Direct rewards.pool_<name> lists are also supported. Nested pools win
  # if both locations define the same name. Names are case-insensitive.
  # Missing/empty pools pay nothing and leave the claim available.
  # An omitted rewards.pool never inherits the jar's example rewards.
  pool:
    - weight: 4
      display: "#50d990x3 #b8906eDiamond"
      items:
        - item: "DIAMOND"
          amount: 3
    - weight: 3
      display: "#50d990x16 #b8906eGolden Apple"
      items:
        - item: "GOLDEN_APPLE"
          amount: 16
    - weight: 2
      display: "#50d990x1 #b8906eExperience Bottle Stack"
      items:
        - item: "EXPERIENCE_BOTTLE"
          amount: 64
    - weight: 1
      display: "#50d990x1 #b8906eNetherite Ingot"
      items:
        - item: "NETHERITE_INGOT"
          amount: 1
    # An entry can also run console commands ('commands:', with %player% and
    # %uuid%) instead of, or as well as, handing items over. Items are the
    # safer half: a failed 'give' is invisible to the plugin, so the player is
    # marked paid having received nothing, while a failed item hands the
    # milestone back. 'item:' takes the same four forms as an activity icon -
    # IRON_INGOT, v.iron_ingot, m.<type>.<id>, ia.<namespace:id> - and
    # 'amount:' is 1-64,
    # defaulting to 1. Anything that does not fit is dropped at the player's
    # feet. Unlike a 'give %player% ...' command this also pays a Bedrock or
    # otherwise unsafe player name.
    # - weight: 2
    #   display: "#50d990x3 #b8906eSteel"
    #   items:
    #     - item: "m.material.steel"
    #       amount: 3

# A reward for revealing every one of the day's tasks, paid the moment the
# last one is revealed - at most once per player per day, and a reroll after
# it does not earn it again. Only players in one of the groups below get it:
# a group is matched by the group.<name> permission, which LuckPerms gives to
# every member. The permission must actually be set on the player: an
# operator is not in a group just by being op. A player granted '*' (every
# permission) does count as in every group, and so gets the first one's
# reward - there is no LuckPerms or Vault API here to ask about real group
# membership instead. When several match, the first listed wins, so list the
# highest rank first. Each value is 'pool', 'pool_<name>', or a fixed item, as in
# rewards.drops. 'pool' makes one weighted draw from rewards.pool, paid as
# written (rewards.multiplier does not apply) and announced with the entry's
# display; with rewards.pool empty it pays nothing, which load warns about.
# A fixed item is a block with 'item:' (required) and 'amount:'
# (optional, 1-64, default 1), or the one-line '<item path> [amount 1-64]'
# form, multiplied by rewards.multiplier, dropped at the feet when it does
# not fit, and reported at load when it does not parse. A player in no group
# is not marked as paid, so joining a group later that day and opening
# /activity still pays it. A reward that hands nothing over at payout leaves
# it unclaimed; opening /activity again retries it (a 'pool' group draws
# again).
daily-reward:
  groups: {}
  # groups:
  #   ascended:
  #     item: m.material.steel
  #     amount: 3
  #   legacy: pool
  #   vip: DIAMOND

gui:
  title: "&8Weekly Activity"

bar:
  max: 50            # points to fill the weekly bar
  daily-max: 10      # most points one day can add - anything past it is lost and never reaches the weekly bar
  vote-share: 50     # percent of daily-max only voting can fill (0-100, 0 = off). Every other activity
                     # together adds at most the rest - 5 of 10 here - and anything past that is lost
  milestones: [10, 20]  # point totals a reward can be claimed at. The bar keeps filling past the
                        # last one but pays nothing more until the week resets. A change applies
                        # at once on reload: a new milestone above a player's claimed total is
                        # claimable this week, one at or below it is not paid to them this week.
                        # Sorted and deduped on load; values below 1 or above bar.max are dropped.
                        # Each is drawn as a marker in the weekly bar.
  length: 40         # segments - the weekly bar only; per-activity bars are fixed at 20

# The reroll button in the GUI (slot 4). It throws today's draw away and hands
# out a fresh one, taking today's points back off the weekly bar - but never
# below what has already been claimed, so a reward paid for cannot be re-earned.
# Clicking it needs the activity.reroll permission (default false; grant it to
# whichever rank the perk belongs to).
reroll:
  per-day: 1         # rerolls each player gets per day; 0 disables the button for everyone
  max-points: 1      # refuse the reroll once today's earned points are above this; 0 allows it only before anything is earned

sounds:               # Bukkit Sound names, "" disables
  goal-complete: ENTITY_EXPERIENCE_ORB_PICKUP   # every time points are earned
  bar-complete: UI_TOAST_CHALLENGE_COMPLETE     # milestone reached / claimed

save-interval-minutes: 5

# Shortest gap, per player, between two runs of any activity's
# 'click-commands'. A click inside it does nothing at all. Clamped to
# 50-60000; there is no "off" value, since 0 would let a held mouse button
# make the console run commands at click rate.
click-command-cooldown-millis: 1000

# The ceiling the per-player cooldown above cannot give: how many click-command
# dispatches the whole server may do in a second, however many players are
# clicking. They run on the main thread, so a hundred players each holding a
# mouse button is a hundred console commands a tick-budget has to pay for. A
# click over the ceiling does nothing at all, exactly like one inside the
# cooldown. Clamped to 1-200.
#
# A click pays for every command it dispatches, not one flat token - so with
# click-commands-per-click: 5 below, a click running five commands costs five.
# A click needs one token to be allowed and may then take the budget negative
# paying for the rest, so setting this lower than click-commands-per-click
# still works: it just means one click and then a wait, rather than nothing
# ever running.
click-commands-per-second: 20

# Most commands one click may dispatch. The cooldown counts a click and not a
# command, so without this a 20-entry 'click-commands' list would multiply the
# cost of every click by twenty. Anything past this is dropped and reported
# once. Clamped to 1-50.
click-commands-per-click: 5

# Feeds the 'playtime' activity above: one counted action per whole minute a
# player is online whose client has not gone silent. Part-minutes at join and
# quit are dropped.
#
# READ THIS BEFORE TREATING afk-minutes AS AN ANTI-AFK CONTROL. IT IS NOT ONE.
# The idle timer it reads is reset by ANY packet from the client - moving,
# swinging an arm, clicking in an inventory, turning the camera. So it only
# excludes a player whose game has crashed, been backgrounded, or otherwise
# stopped talking to the server. It does NOT stop a mouse jiggler, an
# autoclicker, an anti-AFK mod, or a macro that swings once a minute; all of
# those keep earning playtime exactly as if the player were at the keyboard.
#
# The real limit on that is daily-cap. With every: 60 and daily-cap: 3 above, a
# player who leaves a macro running all week earns 21 points against bar.max of
# 50 - well under half the weekly bar over the whole week, from playtime alone,
# and 3 of the 10 points bar.daily-max allows each day. If that matters on your
# server, lower playtime's daily-cap; changing afk-minutes will not help.
playtime:
  afk-minutes: 5     # client silent this long => the minute does not count; 0 disables the check
