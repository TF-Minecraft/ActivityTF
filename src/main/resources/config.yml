  # RPCharacters: profession upgrades purchased
  profession_upgrade:
    group: crafting
    display: "#e6ca40&lProfession Upgrade"
    material: EXPERIENCE_BOTTLE
    every: 1
    points: 1
    daily-cap: 2
  # MMOCore professions - these need MMOCore installed to be fed; without it
  # they show in /activity but can never be filled.
  profession_crafter:
    group: crafting
    display: "#e6ca40&lCrafter XP"
    material: CRAFTING_TABLE
    every: 500       # 500 profession XP → 1 point
    points: 1
    daily-cap: 2
    profession: crafter
  profession_forager:
