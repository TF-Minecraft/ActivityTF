reset:
  day: MONDAY      # server timezone
  hour: 0          # 0-23

# Every 'every' actions → earn 'points'. 'daily-cap' = most points one
# activity can add per day (0 = no cap). Bar caps at bar.max.
# vote: one point per vote site. quest: fed by the quests plugin via
#   /activity add <player> quest 1
# playtime: 'every' counts minutes online - see the playtime section at the
#   bottom, and read what afk-minutes does and does not do before relying on it.
# material: the GUI icon, and craft: the item this activity counts crafts of.
#   Both accept the same three forms:
#     IRON_INGOT        a bare vanilla Material name
#     v.iron_ingot      the same thing written as a TLibs item path
#     m.material.steel  an MMOItems item, as m.<type>.<id> - needs TLibs,
#                       MMOItems and MythicLib all installed
#   The m. form is resolved by TLibs: without it, or without MMOItems and
#   MythicLib, such an icon falls back to PAPER and such a craft is never
#   fed, and either way it is logged the first time it is used (GUI open /
#   craft), not on startup. A malformed or unsupported path is logged the
#   same way.
# craft: optional; a shift-click bulk craft counts every item it made. One
#   item feeds one activity - if two claim the same one, only the first is
#   credited. An unknown name, or a name that is not an item, is logged and
#   that activity is simply never fed. Crafts of a tracked vanilla material
#   never consult TLibs; other crafts check each m. path.
#   The count is worked out at the moment of the click, from the same limits
#   the game itself obeys: a normal click makes exactly one batch, and a
#   shift-click repeats until either the shortest ingredient stack or the room
#   in your inventory (main inventory + hotbar, not armour or offhand) runs
#   out. Nothing is looked at afterwards, so nothing you do later in the tick
#   changes the credit. Clicks that craft nothing - a double-click on the
#   result slot, a number-key or offhand swap onto a slot that is already
#   holding something - count nothing. It still errs low in one place:
#     - a shift-click whose last pass only partly fits counts as a whole batch
#       fewer. Shift-crafting into a full inventory counts nothing, because
#       nothing is made.
#   A shift-click is capped by the shortest ingredient stack, so any recipe
#   with an unstackable ingredient (CAKE needs milk buckets) can only ever make
#   one batch per click, and one click is one craft. A stackable remainder
#   (HONEY_BLOCK hands back glass bottles) does bulk-craft, and is counted like
#   any other bulk craft.
# profession: optional, MMOCore only. Ties the activity to one MMOCore
#   profession id (as named by plugins/MMOCore/professions/<id>.yml; case,
#   underscores and spaces do not matter) and counts XP gained in it - so
#   'every' is XP, not actions. Fractional XP is carried over between gains
#   rather than lost. Two activities naming the same profession is a config
#   error and only the last one is fed. Always set a daily-cap on these:
#   profession XP is unbounded, unlike the one-per-action activities.
activities:
  vote:
    display: "#e6ca40&lVoting"
    material: v.paper
    every: 1
    points: 1
    daily-cap: 5
  quest:
    display: "#e6ca40&lDaily Quests"
    material: BOOK
    every: 1
    points: 1
    daily-cap: 5
  geiger:
    display: "#e6ca40&lRadioactive Sources"
    material: SPYGLASS
    every: 3
    points: 1
    daily-cap: 1
  instrument:
    display: "#e6ca40&lMusical Instruments"
    material: NOTE_BLOCK
    every: 20
    points: 1
    daily-cap: 1
  playtime:
    display: "#e6ca40&lTime Played"
    material: CLOCK
    every: 60          # 60 counted minutes => 1 point
    points: 1
    daily-cap: 3
  craft_diamond_block:
    display: "#e6ca40&lCraft Diamond Blocks"
    material: DIAMOND_BLOCK
    every: 3
    points: 1
    daily-cap: 1
    craft: DIAMOND_BLOCK
  craft_golden_carrot:
    display: "#e6ca40&lCraft Golden Carrots"
    material: v.golden_carrot
    every: 16
    points: 1
    daily-cap: 1
    craft: GOLDEN_CARROT
  craft_anvil:
    display: "#e6ca40&lCraft Anvils"
    material: ANVIL
    every: 1
    points: 1
    daily-cap: 1
    craft: ANVIL
  # VFBuilders: a vehicle finished at a construction station
  vehicle_build:
    display: "#e6ca40&lBuild Vehicles"
    material: MINECART
    every: 1
    points: 1
    daily-cap: 2
  # RPCharacters: in-character chat messages
  ic_chat:
    display: "#e6ca40&lRoleplay Chat"
    material: WRITABLE_BOOK
    every: 30
    points: 1
    daily-cap: 2
  # InteractibleFurniture: furniture placed in the world
  furniture_place:
    display: "#e6ca40&lPlace Furniture"
    material: BARREL
    every: 5
    points: 1
    daily-cap: 1
  # SimpleFactions: every participant of every ended battle
  battle_joined:
    display: "#e6ca40&lFaction Battles"
    material: IRON_SWORD
    every: 1
    points: 1
    daily-cap: 3
  # AdvancedCrafting: items and alloys crafted at its stations
  advcraft_item:
    display: "#e6ca40&lAdvanced Crafting"
    material: SMITHING_TABLE
    every: 5
    points: 1
    daily-cap: 2
  # MMOCore professions - uncomment to enable. They need MMOCore installed;
  # without it they show in /activity but can never be filled.
  #profession_crafter:
  #  display: "#e6ca40&lCrafter XP"
  #  material: CRAFTING_TABLE
  #  every: 500       # 500 profession XP → 1 point
  #  points: 1
  #  daily-cap: 2
  #  profession: crafter
  #profession_forager:
  #  display: "#e6ca40&lForager XP"
  #  material: WHEAT
  #  every: 500
  #  points: 1
  #  daily-cap: 2
  #  profession: forager
  #profession_herborist:
  #  display: "#e6ca40&lHerborist XP"
  #  material: FERN
  #  every: 500
  #  points: 1
  #  daily-cap: 2
  #  profession: herborist

# Console commands run once per milestone (every bar.reward-every points)
# when the player clicks the reward chest in /activity.
# %player% = name, %uuid% = the player's UUID.
# A command containing %player% is skipped with a warning when the name is not
# [A-Za-z0-9_.]{1,16} (e.g. a Bedrock name with a space); commands that only
# use %uuid% always run. If none of the commands below can run for a given
# player (their name is unsafe and every command pastes %player%), nothing is
# marked claimed and the reward stays claimable, so fixing the commands below
# still pays it out. To reward Bedrock/Floodgate or other unsafe names, write
# reward commands using only %uuid% (e.g. via a plugin that can look a player
# up by UUID) instead of %player%.
rewards:
  commands:
    - "give %player% diamond 3"
  display:            # shown in GUI reward item
    - "#50d990x3 #b8906eDiamond"

gui:
  title: "&8Weekly Activity"
  reward-material: CHEST # bare name or v.<material> only - not an m. item path

bar:
  max: 20            # points to fill the bar
  reward-every: 10   # a claimable reward at every multiple
  length: 40         # segments - the weekly bar only; per-activity bars are fixed at 20

sounds:               # Bukkit Sound names, "" disables
  goal-complete: ENTITY_EXPERIENCE_ORB_PICKUP   # every time points are earned
  bar-complete: UI_TOAST_CHALLENGE_COMPLETE     # milestone reached / claimed

save-interval-minutes: 5

# Feeds the 'playtime' activity above: one counted action per whole minute a
# player is online whose client has not gone silent. Part-minutes at join and
# quit are dropped.
#
# READ THIS BEFORE TREATING afk-minutes AS AN ANTI-AFK CONTROL. IT IS NOT ONE.
# The idle timer it reads is reset by ANY packet from the client - moving,
# swinging an arm, clicking in an inventory, turning the camera. So it only
# excludes a player whose game has crashed, been backgrounded, or otherwise
# stopped talking to the server. It does NOT stop a mouse jiggler, an
# autoclicker, an anti-AFK mod, or a macro that swings once a minute; all of
# those keep earning playtime exactly as if the player were at the keyboard.
#
# The real limit on that is daily-cap. With every: 60 and daily-cap: 3 above, a
# player who leaves a macro running all week earns 21 points against bar.max of
# 20 - i.e. a full bar from playtime alone. If that matters on your server,
# lower playtime's daily-cap; changing afk-minutes will not help.
playtime:
  afk-minutes: 5     # client silent this long => the minute does not count; 0 disables the check
