main: tfmc.justin.activity.ActivityPlugin
version: 1.0
name: activity
author: Justin
api-version: 1.21
softdepend: [VotingPlugin, MusicalInstruments, geiger_counter, MMOCore, MMOItems, PlaceholderAPI,
             VFBuilders, RPCharacters, InteractibleFurniture, SimpleFactions, AdvancedCrafting, TLibs, Archaeo,
             MarketBlock, Games, Cooking]
commands:
  activity:
    description: Open the weekly activity bar, or run admin subcommands
    usage: /activity [reload|reset <player>|add <player> <activity> <count> [--force]]
permissions:
  activity.use:
    description: Open the weekly activity GUI
    default: true
  activity.reroll:
    description: Reroll today's activity tasks from the GUI (Ascended perk)
    default: false
  activity.admin:
    description: Access to activity admin subcommands
    default: op
