main: net.tfminecraft.activitytf.ActivityPlugin
version: ${project.version}
name: activity
author: Justin
api-version: '1.21.10'
softdepend: [VotingPlugin, MusicalInstruments, geiger_counter, MMOCore, MMOItems, MythicLib, PlaceholderAPI,
             VFBuilders, RPCharacters, InteractibleFurniture, SimpleFactions, AdvancedCrafting, TLibs, Archaeo,
             MarketBlock, Games, Cooking, ItemsAdder, BreweryX]
commands:
  activity:
    description: Open the weekly activity bar, or run admin subcommands
    usage: /activity [reload|rewards [apply]|check <player>|reset <player>|givereroll <player>|add <player> <activity> <count> [--force]|addpoints <player> <points>]
  referral:
    description: Open the referral menu, pick who invited you, or run referral staff subcommands
    usage: /referral [invitedby <name>|info <player>|unlink <player>|addtime <player> <minutes>|allowip <player>]
    aliases: [referrals]
permissions:
  activity.use:
    description: Open the weekly activity GUI
    default: true
  activity.reroll:
    description: Reroll today's activity tasks from the GUI (Ascended perk)
    default: false
  activity.check:
    description: Inspect another player's activity state
    default: op
  activity.referral:
    description: Open the referral menu and claim referral rewards
    default: true
  activity.referral.admin:
    description: Inspect, unlink, adjust referral playtime and exempt accounts from the same-connection check
    default: op
  activity.admin:
    description: Access to activity admin subcommands
    default: op
    children:
      activity.check: true
      activity.referral.admin: true
