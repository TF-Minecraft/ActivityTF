name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Fetch private dependencies
        env:
          GH_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          mkdir -p libs
          gh release download v1 --repo JustinasLa/tfmc-deps --dir libs --clobber \
            --pattern 'VotingPlugin-7.0.jar' \
            --pattern 'musicalinstruments-2.5.jar' \
            --pattern 'geiger_counter-1.1.3.jar'

      - name: Verify private dependencies
        run: sha256sum -c libs/SHA256SUMS

      - name: Build
        run: mvn -B --no-transfer-progress clean package

      - uses: actions/upload-artifact@v4
        with:
          name: activity-jar-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 90
